name: Deploy DevInquire CMS to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Java Backend
        run: |
          cd java-backend
          mvn -q -DskipTests package

      - name: Build Frontend
        run: |
          echo "VITE_API_URL=http://${{ secrets.OCI_HOST }}" > .env.local
          npm install --no-audit --no-fund
          npm run build

      - name: Package deployment bundle
        run: |
          tar -czf deploy.tar.gz \
            dist \
            server.ts \
            server \
            package.json \
            package-lock.json \
            types.ts \
            sampleData.ts \
            firebase-applet-config.json \
            java-backend/devinquire-cms-server/target/devinquire-cms-server-1.0.0.jar

      - name: Upload bundle to Oracle Cloud VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          source: "deploy.tar.gz"
          target: "/home/opc/"

      - name: Install runtime & restart services on Oracle Linux VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e

            if ! command -v java >/dev/null 2>&1 || ! command -v nginx >/dev/null 2>&1; then
              sudo dnf install -y java-21-openjdk-headless nginx curl
            fi
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash -
              sudo dnf install -y nodejs
            fi

            mkdir -p ~/DevInquire-CMS
            tar -xzf ~/deploy.tar.gz -C ~/DevInquire-CMS
            rm -f ~/deploy.tar.gz

            cd ~/DevInquire-CMS
            npm install --omit=dev --no-audit --no-fund

            if [ ! -f /etc/systemd/system/devinquire-java.service ]; then
              sudo tee /etc/systemd/system/devinquire-java.service > /dev/null <<'EOF'
            [Unit]
            Description=DevInquire CMS Java Backend
            After=network.target
            [Service]
            User=opc
            WorkingDirectory=/home/opc/DevInquire-CMS/java-backend
            ExecStart=/usr/bin/java -Xmx512m -jar /home/opc/DevInquire-CMS/java-backend/devinquire-cms-server/target/devinquire-cms-server-1.0.0.jar
            Restart=always
            RestartSec=5
            [Install]
            WantedBy=multi-user.target
            EOF
            fi

            if [ ! -f /etc/systemd/system/devinquire-web.service ]; then
              sudo tee /etc/systemd/system/devinquire-web.service > /dev/null <<'EOF'
            [Unit]
            Description=DevInquire CMS Frontend Gateway
            After=network.target devinquire-java.service
            [Service]
            User=opc
            WorkingDirectory=/home/opc/DevInquire-CMS
            Environment=NODE_ENV=production
            ExecStart=/usr/bin/npm start
            Restart=always
            RestartSec=5
            [Install]
            WantedBy=multi-user.target
            EOF
            fi

            sudo systemctl daemon-reload
            sudo systemctl enable devinquire-java devinquire-web
            sudo systemctl restart devinquire-java devinquire-web

            if [ ! -f /etc/nginx/conf.d/devinquire-cms.conf ]; then
              sudo tee /etc/nginx/conf.d/devinquire-cms.conf > /dev/null <<'EOF'
            server {
                listen 80;
                server_name _;
                location = / { return 302 /cms/; }
                location /cms/ {
                    proxy_pass http://127.0.0.1:3002/cms/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header CF-IPCountry $http_cf_ipcountry;
                }
                location /api/ {
                    proxy_pass http://127.0.0.1:8080/api/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            }
            EOF
              sudo setsebool -P httpd_can_network_connect 1 || true
              sudo firewall-cmd --permanent --add-service=http --add-service=https || true
              sudo firewall-cmd --reload || true
            fi

            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            echo "Deployment completed successfully!"
