server:
  port: ${PORT:8080}

spring:
  application:
    name: devinquire-cms-server
  datasource:
    # Defaults to embedded H2 file DB for zero-config local dev; override with MySQL/PostgreSQL in prod
    url: ${DB_URL:jdbc:h2:file:./data/devinquire_cms;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

devinquire:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
